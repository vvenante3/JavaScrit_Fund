<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    
    Velocidade do Carro: <input type="number" name="txtvel" id="txtvel"> Km/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">

    </div>

    <script>
        function calcular() {
            var txtv = document.getElementById('txtvel')
            var res = document.getElementById('res')
            var vel = Number(txtv.value)
            
            res.innerHTML = `Sua velocidade atual é de: <strong>${vel} Km/h</strong>`

            if (vel > 60) {
                res.innerHTML += `<p>Você foi MULTADO por <strong>excesso</strong> de velocidade.</p>`

                var limite =  vel - 60

                res.innerHTML += `<p>Você esteve <strong>${limite} Km/h</strong> acima da velicade.</p>`

            }
            
        }
        


    </script>
</body>
</html>
