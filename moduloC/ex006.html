<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        .area{
            font: normal 50pt Arial;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;        /* centraliza o conteúdo dentro */
            padding: 100px;
            border-radius: 500px;
        }

        .elemento {
            display: flex;
            justify-content: center;  /* Centraliza Horizontal */
            align-items: center;      /* Centraliza Vertical   */
            height: 100vh;            /* Altura Total da Tela  */
        }
    </style>
</head>
<body>
    <!-- Disparos pelo próprio HTML -->
    <container class="elemento">
        <div class="area" id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="saiu()">
            Interaja
        </div>
    </container>
    <script>
        var a = document.getElementById('area') // só para demonstração educativa

        function clicar(){
            a.innerText = 'Clicou!'
            a.style.background = 'red'
        }

        function entrar(){
            a.innerText = "Entrou!"
        }

        function saiu(){
            a.innerText = "Saiu!"
            a.style.background = 'green'
        }

    </script>
</body>
</html>
