<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 003</title>
    <style>
        body {
            background-color: gray;
            color: white;
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <h1>Teste</h1>
    <p>Oh yes baby!</p>
    <script>
        var n1 = Number(window.prompt('Digite um número: '))                        //prompt retorna como 'string' -> utilizamos o Number(n) para convertermos para int
        var n2 = Number.parseFloat(window.prompt('Digite outro número: '))         //tambem e possivel utilizar .parseFloat
        
        var soma = n1 + n2 // é necessario formar a subtracao diferente da concatenacao

        // window.alert(String(soma)) // retorna como 'string'

        window.alert(`A soma entre ${n1} e ${n2} é de ${soma}`)

    </script>
</body>
</html>
